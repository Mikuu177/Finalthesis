run_name: classifier_prompt_router
seed: 42

dataset_path: data/raw/tram_arithmetic_mcq.jsonl
subset_size: 0
filter_category:
  - Hour Adjustment (24h)
  - Time Zone Conversion
  - Date Computation
  - Year Shift
  - Month Shift
sample_size: 400

# one serving LLM for fair comparison against baselines
models:
  - deepseek_chat

classifier_model_path: outputs/classifier/task_clf.joblib
prompt_bank_path: configs/prompt_bank.yaml
prompt_dir: prompts

params:
  temperature: 0.2
  max_tokens: 512
  timeout: 60

outputs_dir: outputs/runs
cache_dir: .cache_classifier_prompt_router
